name: Release (Windows)

on:
  workflow_call:
    inputs:
      survey_key:
        required: false
        type: string
        default: ""
      is_tag:
        required: true
        type: string
  # Manual run: builds from the current checkout without publishing anything
  # (artifacts are downloadable from the run page for local verification).
  workflow_dispatch:
    inputs:
      survey_key:
        required: false
        type: string
        default: ""

jobs:
  # x86/x64: MinGW (msvcrt) build, compatible with Windows 7.
  # MSVC builds import Win8+ APIs (CopyFile2/CreateFile2/GetSystemTimePreciseAsFileTime)
  # via the statically linked MSVC STL <filesystem>, which cannot run on Windows 7.
  windows-mingw:
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x64
          msystem: MINGW64
          prefix: x86_64
        - arch: x86
          msystem: MINGW32
          prefix: i686

    name: Windows MinGW (${{ matrix.arch }})

    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msystem }}
        update: true
        install: >-
          mingw-w64-${{ matrix.prefix }}-toolchain
          mingw-w64-${{ matrix.prefix }}-cmake
          mingw-w64-${{ matrix.prefix }}-ninja
          mingw-w64-${{ matrix.prefix }}-libpng
          mingw-w64-${{ matrix.prefix }}-zlib
          mingw-w64-${{ matrix.prefix }}-zstd
          mingw-w64-${{ matrix.prefix }}-xz
          mingw-w64-${{ matrix.prefix }}-opusfile

    - name: Download source (called from Release)
      if: github.event_name != 'workflow_dispatch'
      uses: actions/download-artifact@v8
      with:
        name: internal-source

    - name: Check out source (manual run)
      if: github.event_name == 'workflow_dispatch'
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Unpack source (called from Release)
      if: github.event_name != 'workflow_dispatch'
      run: |
        tar -xf source.tar.gz --strip-components=1

    - name: Install lzo2 (x64, from repo)
      if: matrix.arch == 'x64'
      run: |
        pacman --noconfirm -S --needed mingw-w64-x86_64-lzo2

    # MSYS2 no longer ships i686 lzo2/make packages; build lzo2 with cmake
    # (already installed) from source for x86.
    - name: Build lzo2 from source (i686 only)
      if: matrix.arch == 'x86'
      run: |
        curl -sL -o lzo.tar.gz https://www.oberhumer.com/opensource/lzo/download/lzo-2.10.tar.gz
        tar -xf lzo.tar.gz
        cmake -B lzo-build -S lzo-2.10 -GNinja \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=OFF \
          -DCMAKE_INSTALL_PREFIX=/mingw32
        cmake --build lzo-build
        cmake --install lzo-build

    - name: Install pandoc
      shell: pwsh
      run: |
        choco install pandoc -y

    - name: Build tools
      run: |
        mkdir build-host
        cd build-host

        echo "::group::CMake"
        cmake ${GITHUB_WORKSPACE} \
          -GNinja \
          -DOPTION_TOOLS_ONLY=ON \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          # EOF
        echo "::endgroup::"

        echo "::group::Build"
        cmake --build . --target tools
        echo "::endgroup::"

    - name: Build
      run: |
        mkdir build
        cd build

        echo "::group::CMake"
        # i686: GCC 16 LTO mis-compiles/merges template weak symbols
        # (multiple definition of vector::_M_realloc_append at link time),
        # so disable LTO for the 32-bit build only.
        cmake ${GITHUB_WORKSPACE} \
          -GNinja \
          -DHOST_BINARY_DIR=${GITHUB_WORKSPACE}/build-host \
          -DCMAKE_BUILD_TYPE=Release \
          -DOPTION_USE_NSIS=OFF \
          -DCMAKE_FIND_LIBRARY_SUFFIXES=".a" \
          -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++" \
          -DOPTION_SURVEY_KEY=${{ inputs.survey_key }} \
          ${{ matrix.arch == 'x86' && '-DOPTION_NO_LTO=ON' || '' }} \
          # EOF
        echo "::endgroup::"

        echo "::group::Build"
        cmake --build . --target openttd
        echo "::endgroup::"

    - name: Check Windows 7 compatibility
      run: |
        echo "::group::Import check"
        if objdump -p openttd.exe | grep -iE "CopyFile2|CreateFile2|GetSystemTimePreciseAsFileTime"; then
          echo "::error::openttd.exe imports Windows 8+ APIs, it will not run on Windows 7"
          exit 1
        fi
        echo "::endgroup::"

        echo "::group::DLL check"
        if objdump -p openttd.exe | grep "DLL Name" | grep -vE "KERNEL32\.dll|USER32\.dll|GDI32\.dll|SHELL32\.dll|ole32\.dll|OLEAUT32\.dll|ADVAPI32\.dll|WS2_32\.dll|WINMM\.dll|IMM32\.dll|USP10\.dll|PSAPI\.DLL|WINHTTP\.dll|bcrypt\.dll|OPENGL32\.dll|msvcrt\.dll|VERSION\.dll"; then
          echo "::warning::openttd.exe links unexpected DLLs, make sure they are bundled"
        fi
        echo "::endgroup::"
      working-directory: build

    - name: Create bundles
      run: |
        cd ${GITHUB_WORKSPACE}/build
        echo "::group::Run CPack"
        cpack
        echo "::endgroup::"

        echo "::group::Cleanup"
        # Remove the sha256 files CPack generates; we will do this ourself at
        # the end of this workflow.
        rm -f bundles/*.sha256
        echo "::endgroup::"

    - name: Store bundles
      uses: actions/upload-artifact@v7
      with:
        name: openttd-windows-${{ matrix.arch }}
        path: build/bundles
        retention-days: 5

  # arm64: only exists on Windows 10+, keep the MSVC + vcpkg build.
  # (Requires the internal-source artifact, so it only runs in the release flow.)
  windows:
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: arm64
          host: x64_arm64

    name: Windows (${{ matrix.arch }})

    runs-on: windows-latest

    steps:
    - name: Download source
      uses: actions/download-artifact@v8
      with:
        name: internal-source

    - name: Unpack source
      shell: bash
      run: |
        tar -xf source.tar.gz --strip-components=1

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Enable Rust cache
      uses: Swatinem/rust-cache@v2

    - name: Setup vcpkg
      id: vcpkg
      uses: OpenTTD/actions/setup-vcpkg@v7

    - name: Install dependencies
      shell: bash
      run: |
        choco install pandoc

    - name: Install MSVC problem matcher
      uses: ammaraskar/msvc-problem-matcher@master

    - name: Configure developer command prompt for tools
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Build tools
      shell: bash
      run: |
        mkdir build-host
        cd build-host

        echo "::group::CMake"
        cmake ${GITHUB_WORKSPACE} \
          -GNinja \
          -DOPTION_TOOLS_ONLY=ON \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          # EOF
        echo "::endgroup::"

        echo "::group::Build"
        cmake --build . --target tools
        echo "::endgroup::"

    - name: Configure developer command prompt for ${{ matrix.arch }}
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.host }}

    - name: Build (with installer)
      if: inputs.is_tag == 'true'
      shell: bash
      run: |
        mkdir build
        cd build

        echo "::group::CMake"
        cmake ${GITHUB_WORKSPACE} \
          -GNinja \
          -DVCPKG_TARGET_TRIPLET=${{ matrix.arch }}-windows-static \
          -DCMAKE_TOOLCHAIN_FILE="${{ steps.vcpkg.outputs.vcpkg-cmake }}" \
          -DOPTION_USE_NSIS=OFF \
          -DHOST_BINARY_DIR=${GITHUB_WORKSPACE}/build-host \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DOPTION_SURVEY_KEY=${{ inputs.survey_key }} \
          # EOF
        echo "::endgroup::"

        echo "::group::Build"
        cmake --build . --target openttd
        echo "::endgroup::"
      env:
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        AZURE_CODESIGN_ACCOUNT_NAME: ${{ secrets.AZURE_CODESIGN_ACCOUNT_NAME }}
        AZURE_CODESIGN_ENDPOINT: ${{ secrets.AZURE_CODESIGN_ENDPOINT }}
        AZURE_CODESIGN_PROFILE_NAME: ${{ secrets.AZURE_CODESIGN_PROFILE_NAME }}

    - name: Build (without installer)
      if: inputs.is_tag != 'true'
      shell: bash
      run: |
        mkdir build
        cd build

        echo "::group::CMake"
        cmake ${GITHUB_WORKSPACE} \
          -GNinja \
          -DVCPKG_TARGET_TRIPLET=${{ matrix.arch }}-windows-static \
          -DCMAKE_TOOLCHAIN_FILE="${{ steps.vcpkg.outputs.vcpkg-cmake }}" \
          -DHOST_BINARY_DIR=${GITHUB_WORKSPACE}/build-host \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DOPTION_SURVEY_KEY=${{ inputs.survey_key }} \
          # EOF
        echo "::endgroup::"

        echo "::group::Build"
        cmake --build . --target openttd
        echo "::endgroup::"
      env:
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        AZURE_CODESIGN_ACCOUNT_NAME: ${{ secrets.AZURE_CODESIGN_ACCOUNT_NAME }}
        AZURE_CODESIGN_ENDPOINT: ${{ secrets.AZURE_CODESIGN_ENDPOINT }}
        AZURE_CODESIGN_PROFILE_NAME: ${{ secrets.AZURE_CODESIGN_PROFILE_NAME }}

    - name: Create bundles
      shell: bash
      run: |
        cd ${GITHUB_WORKSPACE}/build
        echo "::group::Run CPack"
        cpack
        echo "::endgroup::"

        echo "::group::Prepare PDB to be bundled"
        PDB=$(ls bundles/*.zip | cut -d/ -f2 | sed 's/.zip$/.pdb/')
        cp openttd.pdb bundles/${PDB}
        xz -9 bundles/${PDB}
        echo "::endgroup::"

        echo "::group::Cleanup"
        # Remove the sha256 files CPack generates; we will do this ourself at
        # the end of this workflow.
        rm -f bundles/*.sha256
        echo "::endgroup::"

    - name: Sign installer
      if: ${{ false }} # inputs.is_tag == 'true'
      shell: bash
      run: |
        ${GITHUB_WORKSPACE}/os/windows/sign.bat "${GITHUB_WORKSPACE}/build/bundles"
      env:
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        AZURE_CODESIGN_ACCOUNT_NAME: ${{ secrets.AZURE_CODESIGN_ACCOUNT_NAME }}
        AZURE_CODESIGN_ENDPOINT: ${{ secrets.AZURE_CODESIGN_ENDPOINT }}
        AZURE_CODESIGN_PROFILE_NAME: ${{ secrets.AZURE_CODESIGN_PROFILE_NAME }}

    - name: Store bundles
      uses: actions/upload-artifact@v7
      with:
        name: openttd-windows-${{ matrix.arch }}
        path: build/bundles
        retention-days: 5
